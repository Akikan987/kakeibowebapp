# 家計簿 Webアプリ（静的配信 + APIの中継）
# 家計簿サーバー（kakeibo リポジトリの server/）が :8000 で動いている前提。
name: kakeibowebapp

services:
  web:
    build: .
    container_name: kakeibo-web
    restart: unless-stopped
    # Capacity limit only; this does not guarantee deletion after a fixed number of days.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3000:80"
    extra_hosts:
      # Linux でも host.docker.internal を使えるようにする
      - "host.docker.internal:host-gateway"
