plugins {
    id "com.android.application"
}

def localDebugKeystore = rootProject.file(".debug/debug.keystore")

android {
    namespace "com.kakeibodata.kakeibo"
    compileSdk 35

    signingConfigs {
        debug {
            storeFile localDebugKeystore
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.kakeibodata.kakeibo"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    testImplementation "junit:junit:4.13.2"
}

tasks.register("generateLocalDebugKey", Exec) {
    onlyIf { !localDebugKeystore.exists() }
    doFirst { localDebugKeystore.parentFile.mkdirs() }
    def keytoolName = System.getProperty("os.name").toLowerCase().contains("win") ? "keytool.exe" : "keytool"
    def keytool = new File(System.getProperty("java.home"), "bin/" + keytoolName)
    commandLine keytool.absolutePath,
            "-genkeypair", "-keystore", localDebugKeystore.absolutePath,
            "-storetype", "JKS", "-storepass", "android", "-keypass", "android",
            "-alias", "androiddebugkey", "-keyalg", "RSA", "-keysize", "2048",
            "-validity", "10000", "-dname", "CN=Android Debug,O=Android,C=US"
}

tasks.configureEach {
    if (name == "preDebugBuild") dependsOn("generateLocalDebugKey")
}
