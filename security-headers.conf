add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-17/GS9xmnwNIuypSPLWZ5nEJSy0Y9sfpZVZFzzk4bQ0='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
