# 家計簿サーバー（FastAPI）の場所。
# Docker Desktop では host.docker.internal がホストPCを指す。
upstream kakeibo_api {
    server host.docker.internal:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 9m;

    # 日本語が確実に正しく解釈されるようにする
    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API は FastAPI へ中継する。同一オリジンになるので CORS が不要。
    location ~ ^/(auth|sync|users|ocr|health|docs|openapi\.json) {
        proxy_pass         http://kakeibo_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ビルド済みアセットは長期キャッシュ（ファイル名にハッシュが付く）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 更新判定に使うファイルは必ずサーバーへ再確認する。
    # ハッシュ付き assets だけを長期キャッシュし、旧HTMLと新JSの混在を防ぐ。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # PRサイトはReactアプリとは別の静的ページとして配信する
    location = /pr {
        # Cloudflare Tunnel内ではHTTPになるため、相対Locationのまま返してHTTPSを維持する
        absolute_redirect off;
        return 301 /pr/;
    }

    location ^~ /pr/ {
        try_files $uri $uri/ =404;
    }

    # SPA なので、それ以外は index.html を返す
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
