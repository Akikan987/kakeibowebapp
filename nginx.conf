# 家計簿サーバー（FastAPI）の場所。
# Docker Desktop では host.docker.internal がホストPCを指す。
upstream kakeibo_api {
    server host.docker.internal:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 9m;

    # 日本語が確実に正しく解釈されるようにする
    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API は FastAPI へ中継する。同一オリジンになるので CORS が不要。
    location ~ ^/(auth|sync|users|ocr|health|docs|openapi\.json) {
        proxy_pass         http://kakeibo_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ビルド済みアセットは長期キャッシュ（ファイル名にハッシュが付く）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA なので、それ以外は index.html を返す
    location / {
        try_files $uri $uri/ /index.html;
    }
}
