<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta id="theme-color-light" name="theme-color" media="(prefers-color-scheme: light)" content="#F7F9FC" />
    <meta id="theme-color-dark" name="theme-color" media="(prefers-color-scheme: dark)" content="#101418" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="収入と支出を記録して、割り勘もできる家計簿アプリ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="家計簿" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>家計簿</title>
    <script>
      (() => {
        const saved = localStorage.getItem('kakeibo.theme')
        const dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        const lightThemeColor = document.querySelector('#theme-color-light')
        const darkThemeColor = document.querySelector('#theme-color-dark')
        if (saved === 'light' || saved === 'dark') {
          lightThemeColor.media = saved === 'light' ? 'all' : 'not all'
          darkThemeColor.media = saved === 'dark' ? 'all' : 'not all'
        }
        const background = dark ? '#101418' : '#F7F9FC'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.documentElement.style.backgroundColor = background
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
