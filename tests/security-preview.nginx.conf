# Local disposable API fixture: not used by the production Dockerfile.
map $host $hsts_header { default ""; }
server {
    listen 80;
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;
    location ~ ^/(auth|sync|users|ocr|health) {
        proxy_pass http://host.docker.internal:18020;
    }
    location / { try_files $uri $uri/ /index.html; }
}
